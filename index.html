<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>استوديو قوالب الفواتير | Invoice Template Studio</title>
  <meta name="description" content="منصة احترافية لإعادة تصميم الفواتير الصادرة من أي نظام ERP إلى قوالب احترافية بنمط الأعمال السعودي." />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <!-- iOS standalone support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="قوالب الفواتير" />

  <!-- Fonts (Arabic-first) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind Play CDN (zero-build; suitable for the GitHub Pages v1) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Guarded so it never throws if the CDN is unavailable (offline / restricted network).
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        theme: { extend: { fontFamily: { sans: ['Tajawal', 'system-ui', 'sans-serif'] } } },
      };
    }
  </script>

  <!-- App styles -->
  <link rel="stylesheet" href="./assets/css/app.css" />
  <link rel="stylesheet" href="./assets/css/invoice-base.css" />
  <style> html, body { font-family: 'Tajawal', system-ui, sans-serif; } </style>
</head>
<body>
  <div id="app">
    <div class="max-w-3xl mx-auto p-16 text-center text-slate-400">جارٍ التحميل…</div>
  </div>

  <!-- ES Modules entry -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
