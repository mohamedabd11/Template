name: Deploy to GitHub Pages

# نشر الموقع الثابت تلقائياً على GitHub Pages عند كل دفع، مع إمكانية التشغيل اليدوي.
on:
  push:
    branches:
      - main
      - claude/invoice-template-studio-J9CGm
  workflow_dispatch:

# الصلاحيات المطلوبة لنشر صفحات GitHub.
permissions:
  contents: read
  pages: write
  id-token: write

# تشغيل واحد فقط في كل مرة؛ إلغاء عمليات النشر القيد التنفيذ القديمة.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        # الموقع ثابت بلا خطوة build — نرفع جذر المستودع كما هو.
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
